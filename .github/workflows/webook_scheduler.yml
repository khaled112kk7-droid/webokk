name: Webook Monitor

on:
  schedule:
    # سيتم تشغيل السكربت كل 5 دقائق
    - cron: "*/5 * * * *"
  workflow_dispatch: # يتيح لك التشغيل اليدوي من واجهة GitHub

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # إضافة خطوة تثبيت Tesseract OCR الأساسية للنظام
      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests Pillow pytesseract
          playwright install chromium
          playwright install-deps chromium

      - name: Run Checkcat Script
        env:
          WEBOOK_EMIL: ${{ secrets.WEBOOK_EMIL }}
          WEBOOK_PASS: ${{ secrets.WEBOOK_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPTCHA_API_KEY: ${{ secrets.CAPTCHA_API_KEY }}
        run: python CHECKCAT.py
