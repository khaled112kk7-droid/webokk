name: Webook Tickets Monitor Hourly

on:
  schedule:
    # التشغيل التلقائي عند بداية كل ساعة (00:00, 01:00, 02:00 ... إلخ)
    - cron: '0 * * * *'
  workflow_dispatch: # يتيح لك تشغيل السكربت يدوياً في أي وقت للتجربة

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Run Webook Monitor
        env:
          PHONE: ${{ secrets.WEBOOK_EMIL }}
          PASSWORD: ${{ secrets.WEBOOK_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python CHECKCAT.py
