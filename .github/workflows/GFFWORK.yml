name: GFF WORK

on:
  workflow_dispatch: # يتيح التشغيل اليدوي لأول مرة

# منع تداخل وسير أكثر من Workflow في نفس الوقت
concurrency:
  group: page-monitor-group
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests

      - name: Install Playwright Browsers
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run Python Monitor Script
        id: run_script
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
        run: python monitor.py

      # 1. إذا تم اكتشاف الفعالية (السكربت خرج بـ Exit code 100): يتوقف التكرار فوراً
      - name: Handle Event Detection (Stop Workflow Loop)
        if: steps.run_script.exit_code == 100
        run: |
          echo "🚨 تم إضافة التذاكر وإرسال التنبيه! تم إيقاف التكرار التلقائي بنجاح."
          exit 0

      # 2. إذا حدث خطأ غير متوقع في الكود أو الشبكة: يتوقف السكربت لتجنب التكرار اللانهائي في الأخطاء
      - name: Handle Unexpected Script Errors
        if: steps.run_script.exit_code != 0 && steps.run_script.exit_code != 100
        run: |
          echo "❌ حدث خطأ غير متوقع أثناء تشغيل السكربت. تم إيقاف التكرار لتفقد المشكلة."
          exit 1

      # 3. إذا انتهت الـ 10 محاولات بدون إضافة فعالية جديدة (Exit code 0): يتم إطلاق الدورة التالية فوراً
      - name: Trigger Next Run Instantly
        if: steps.run_script.exit_code == 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "✅ انتهت الدورة الحالية بدون تغيير. جاري إطلاق الدورة التالية فوراً..."
          gh api -X POST /repos/${{ github.repository }}/actions/workflows/monitor.yml/dispatches -f ref=${{ github.ref }}
