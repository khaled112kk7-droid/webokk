name: GFF WORK

on:
  workflow_dispatch: # يتيح التشغيل اليدوي لأول مرة

# منع تداخل وسير أكثر من Workflow في نفس الوقت
concurrency:
  group: page-monitor-group
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests

      - name: Install Playwright Browsers
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run Python Monitor Script
        id: run_script
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELE_CHAT_ID }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
        run: python GFFTIK.py

      # 1. عند اكتشاف الفعالية (Exit code 100): يتوقف التكرار فوراً
      - name: Handle Event Detection
        if: steps.run_script.exit_code == 100
        run: |
          echo "🚨 تم اكتشاف الفعالية وإرسال التنبيه! تم إيقاف التكرار التلقائي."
          exit 0

      # 2. عند حدوث خطأ في السكربت: يتوقف لمنع التكرار اللانهائي في الأخطاء
      - name: Handle Unexpected Script Errors
        if: steps.run_script.exit_code != 0 && steps.run_script.exit_code != 100
        run: |
          echo "❌ حدث خطأ غير متوقع في السكربت."
          exit 1

      # 3. إعادة التشغيل تلقائياً وفوراً للدورة التالية مع الاعتماد على اسم الملف الجديد GFFWORK.yml
      - name: Trigger Next Run Instantly
        if: steps.run_script.exit_code == 0
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "✅ انتهت الدورة الحالية بدون تغيير. إعادة التشغيل فوراً..."
          gh workflow run "GFFWORK.yml" --ref ${{ github.ref_name }}
