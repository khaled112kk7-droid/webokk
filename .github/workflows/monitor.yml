name: Webook Monitor

on:
  workflow_dispatch:

concurrency:
  group: webook-monitoring
  cancel-in-progress: true

jobs:
  check-webook:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright requests
        playwright install chromium

    - name: Run Webook monitor script
      env:
        WEBOOK_EMAIL: ${{ secrets.WEBOOK_EMAIL }}
        WEBOOK_PASS: ${{ secrets.WEBOOK_PASS }}
        TELE_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELE_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python main.py

    - name: Trigger Next Run Automatically
      if: always() && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ -f "stop_signal.txt" ]; then
          echo "🛑 تم إرسال تنبيه فتح التذاكر! يتم إيقاف التكرار التلقائي الآن."
        else
          echo "🔄 جاري إطلاق تشغيل جديد متسلسل..."
          sleep 3
          
          # حلقة إعادة محاولة في حال وجود خلل مؤقت في سيرفرات GitHub
          for i in {1..5}; do
            gh workflow run "Webook Monitor" && break || {
              echo "⚠️ فشلت محاولة الإطلاق بسبب خطأ في السيرفر ($i/5)، جاري إعادة المحاولة خلال 10 ثوانٍ..."
              sleep 10
            }
          done
        fi
